name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Export debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BlockNova.apk
          test -s build/BlockNova.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockNova-Android-APK
          path: build/BlockNova.apk
          if-no-files-found: error
          retention-days: 14
