name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Export debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and unpack original KayKit Dungeon Pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaykit-pack assets/kaykit
          curl --fail --location --retry 3 \
            "https://github.com/mahdialloui01-art/BlockNova/releases/download/game-assets-v1/KayKit_Dungeon_Pack_1.1_FREE.zip" \
            --output /tmp/kaykit-dungeon-pack.zip
          echo "6acb859d1aefae074f937d1e6f13656a7312b2bdb6d9f1232ebdade8d93d6a1c  /tmp/kaykit-dungeon-pack.zip" | sha256sum --check
          unzip -q /tmp/kaykit-dungeon-pack.zip -d /tmp/kaykit-pack
          MODEL="$(find /tmp/kaykit-pack -type f -path '*/Assets/gltf/box_small.gltf' -print -quit)"
          if [ -z "$MODEL" ]; then
            echo "Original KayKit box_small.gltf was not found in the release archive."
            find /tmp/kaykit-pack -type f -iname '*.gltf' | head -40
            exit 1
          fi
          ASSETS_DIR="${MODEL%/gltf/box_small.gltf}"
          cp -a "$ASSETS_DIR/." assets/kaykit/
          test -s assets/kaykit/gltf/box_small.gltf
          test -s assets/kaykit/gltf/box_small.bin
          echo "Original KayKit GLTF and companion files installed:"
          ls -lh assets/kaykit/gltf/box_small.gltf assets/kaykit/gltf/box_small.bin

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android platform and build tools
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot Android export settings
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Strict Godot startup validation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" godot-validation.log; then
            echo "Refusing to export an APK with Godot script errors."
            exit 1
          fi
          godot --headless --path . --quit-after 3 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" godot-runtime.log; then
            echo "Refusing to export: main scene failed during startup."
            exit 1
          fi

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/BlockNova.apk
          test -s build/BlockNova.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockNova-Android-APK
          path: build/BlockNova.apk
          if-no-files-found: error
          retention-days: 14
