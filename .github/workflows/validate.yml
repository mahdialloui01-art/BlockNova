name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Import, parse, and runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import and strictly validate all scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" godot-validation.log; then
            echo "Godot reported script/import errors."
            exit 1
          fi

      - name: Run main scene smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" godot-runtime.log; then
            echo "Main scene failed during startup."
            exit 1
          fi

      - name: Verify required project files
        run: |
          test -s project.godot
          test -s scenes/main.tscn
          test -s scripts/main.gd
          test -s scripts/main_3d.gd
