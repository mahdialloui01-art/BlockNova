name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Import and parse project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Verify required project files
        run: |
          test -s project.godot
          test -s scenes/main.tscn
          test -s scripts/main.gd
