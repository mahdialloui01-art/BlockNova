name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Import and parse project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot version
        run: godot --version

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Verify required project files
        run: |
          test -s project.godot
          test -s scenes/main.tscn
          test -s scripts/main.gd
